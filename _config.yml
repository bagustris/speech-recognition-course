# Site settings
remote_theme: bagustris/primer2-theme
title: "Speech Recognition Course"
description: "A comprehensive course on speech recognition technologies and implementation"
baseurl: "/speech-recognition-course"
url: "https://bagustris.github.io"

markdown: kramdown
kramdown:
  input: GFM
  math_engine: mathjax
  highlighter: rouge
  syntax_highlighter: rouge
  parse_block_html: true

sass:
  style: :compressed

# Enable plugins
plugins:
  - jekyll-remote-theme
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Default front matter
defaults:
  - scope:
      path: ""
    values:
      layout: default
      mathjax: true

exclude:
  - node_modules
  - script
  - Experiments/
  - M1_Introduction/misc/
  - M4_Language_Modeling/srilm/
  - M4_Language_Modeling/data/
  - bak/
  - "*.isym"
  - "*.osym"
  - "*.fst"
  - "*.trn"
  - "*.?gram"
  - "*.docx"
  - "*.odt"
  - "*.txt.gz"
  - CLAUDE.md

github:
  private: false
  license:
    name: MIT
  source:
    branch: "master"
    path: "/"
  repository_url: "https://github.com/bagustris/speech-recognition-course"
